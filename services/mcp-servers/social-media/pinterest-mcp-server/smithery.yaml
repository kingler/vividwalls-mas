# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    required:
      - pinterestToken
    properties:
      pinterestToken:
        type: string
        description: Pinterest Access Token to be used with the server.
  commandFunction:
    # A JS function that produces the CLI command based on the given config to start the MCP on stdio.
    |-
    (config) => ({ command: 'python', args: ['server.py', '--pinterest-token', config.pinterestToken] })
  exampleConfig:
    pinterestToken: dummy_pinterest_access_token